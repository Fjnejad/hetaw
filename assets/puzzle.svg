<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 585" class="pz-svg" role="img" aria-labelledby="pz-t pz-d">
<title id="pz-t">Scattered symptoms assembling into one picture</title>
<desc id="pz-d">Six puzzle pieces, each labelled with an endometriosis symptom, come together to form a stylised uterus.</desc>
<defs>
<linearGradient id="pz-sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity=".12"/></linearGradient>
<filter id="pz-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#5A1F1A" flood-opacity=".28"/></filter>
<clipPath id="pz-shape"><path d="M300,150 C230,150 180,185 180,250 C180,330 250,400 300,470 C350,400 420,330 420,250 C420,185 370,150 300,150 Z"/><path d="M200,190 C150,165 110,195 92,240 C84,262 86,286 96,304 L118,296 C110,282 110,262 118,248 C130,222 160,206 208,218 Z"/><path d="M400,190 C450,165 490,195 508,240 C516,262 514,286 504,304 L482,296 C490,282 490,262 482,248 C470,222 440,206 392,218 Z"/><path d="M71,318 a34,44 0 1,0 68,0 a34,44 0 1,0 -68,0 Z"/><path d="M461,318 a34,44 0 1,0 68,0 a34,44 0 1,0 -68,0 Z"/><path d="M268,440 L332,440 L324,500 C318,520 282,520 276,500 Z"/></clipPath>
<mask id="m-p1" maskUnits="userSpaceOnUse" x="0" y="0" width="600" height="585"><rect x="0" y="0" width="600" height="585" fill="black"/><rect x="0" y="80" width="200" height="230" fill="white"/><circle cx="200" cy="195" r="27" fill="white"/><circle cx="100" cy="310" r="28.5" fill="black"/></mask>
<mask id="m-p2" maskUnits="userSpaceOnUse" x="0" y="0" width="600" height="585"><rect x="0" y="0" width="600" height="585" fill="black"/><rect x="200" y="80" width="200" height="230" fill="white"/><circle cx="200" cy="195" r="28.5" fill="black"/><circle cx="400" cy="195" r="28.5" fill="black"/><circle cx="300" cy="310" r="27" fill="white"/></mask>
<mask id="m-p3" maskUnits="userSpaceOnUse" x="0" y="0" width="600" height="585"><rect x="0" y="0" width="600" height="585" fill="black"/><rect x="400" y="80" width="200" height="230" fill="white"/><circle cx="400" cy="195" r="27" fill="white"/><circle cx="500" cy="310" r="28.5" fill="black"/></mask>
<mask id="m-p4" maskUnits="userSpaceOnUse" x="0" y="0" width="600" height="585"><rect x="0" y="0" width="600" height="585" fill="black"/><rect x="0" y="310" width="200" height="230" fill="white"/><circle cx="200" cy="425" r="28.5" fill="black"/><circle cx="100" cy="310" r="27" fill="white"/></mask>
<mask id="m-p5" maskUnits="userSpaceOnUse" x="0" y="0" width="600" height="585"><rect x="0" y="0" width="600" height="585" fill="black"/><rect x="200" y="310" width="200" height="230" fill="white"/><circle cx="200" cy="425" r="27" fill="white"/><circle cx="400" cy="425" r="27" fill="white"/><circle cx="300" cy="310" r="28.5" fill="black"/></mask>
<mask id="m-p6" maskUnits="userSpaceOnUse" x="0" y="0" width="600" height="585"><rect x="0" y="0" width="600" height="585" fill="black"/><rect x="400" y="310" width="200" height="230" fill="white"/><circle cx="400" cy="425" r="28.5" fill="black"/><circle cx="500" cy="310" r="27" fill="white"/></mask>
</defs>
<g class="pz-ghost"><path d="M300,150 C230,150 180,185 180,250 C180,330 250,400 300,470 C350,400 420,330 420,250 C420,185 370,150 300,150 Z"/><path d="M200,190 C150,165 110,195 92,240 C84,262 86,286 96,304 L118,296 C110,282 110,262 118,248 C130,222 160,206 208,218 Z"/><path d="M400,190 C450,165 490,195 508,240 C516,262 514,286 504,304 L482,296 C490,282 490,262 482,248 C470,222 440,206 392,218 Z"/><path d="M71,318 a34,44 0 1,0 68,0 a34,44 0 1,0 -68,0 Z"/><path d="M461,318 a34,44 0 1,0 68,0 a34,44 0 1,0 -68,0 Z"/><path d="M268,440 L332,440 L324,500 C318,520 282,520 276,500 Z"/></g>
<g class="pz pz-p1" style="--dx:-260px;--dy:-140px;--rot:-18deg" filter="url(#pz-shadow)">
  <g mask="url(#m-p1)">
    <g clip-path="url(#pz-shape)"><rect x="0" y="0" width="600" height="585" class="pz-fill" style="fill:#C4574D"/><rect x="0" y="0" width="600" height="585" fill="url(#pz-sheen)"/><g class="pz-seam"><rect x="0" y="80" width="200" height="230" /><circle cx="200" cy="195" r="27" /><circle cx="100" cy="310" r="27" /></g></g>
  </g>
  <g class="pz-label"><rect x="62" y="198" width="121" height="28" rx="14"/><text x="122" y="216.5" text-anchor="middle">Irritable bowel</text></g>
</g>
<g class="pz pz-p2" style="--dx:0px;--dy:-220px;--rot:8deg" filter="url(#pz-shadow)">
  <g mask="url(#m-p2)">
    <g clip-path="url(#pz-shape)"><rect x="0" y="0" width="600" height="585" class="pz-fill" style="fill:#B3463D"/><rect x="0" y="0" width="600" height="585" fill="url(#pz-sheen)"/><g class="pz-seam"><rect x="200" y="80" width="200" height="230" /><circle cx="200" cy="195" r="27" /><circle cx="400" cy="195" r="27" /><circle cx="300" cy="310" r="27" /></g></g>
  </g>
  <g class="pz-label"><rect x="223" y="222" width="154" height="28" rx="14"/><text x="300" y="240.5" text-anchor="middle">“Normal” period pain</text></g>
</g>
<g class="pz pz-p3" style="--dx:260px;--dy:-150px;--rot:16deg" filter="url(#pz-shadow)">
  <g mask="url(#m-p3)">
    <g clip-path="url(#pz-shape)"><rect x="0" y="0" width="600" height="585" class="pz-fill" style="fill:#CF665B"/><rect x="0" y="0" width="600" height="585" fill="url(#pz-sheen)"/><g class="pz-seam"><rect x="400" y="80" width="200" height="230" /><circle cx="400" cy="195" r="27" /><circle cx="500" cy="310" r="27" /></g></g>
  </g>
  <g class="pz-label"><rect x="421" y="198" width="114" height="28" rx="14"/><text x="478" y="216.5" text-anchor="middle">Cystitis / UTI</text></g>
</g>
<g class="pz pz-p4" style="--dx:-270px;--dy:150px;--rot:-12deg" filter="url(#pz-shadow)">
  <g mask="url(#m-p4)">
    <g clip-path="url(#pz-shape)"><rect x="0" y="0" width="600" height="585" class="pz-fill" style="fill:#A93F37"/><rect x="0" y="0" width="600" height="585" fill="url(#pz-sheen)"/><g class="pz-seam"><rect x="0" y="310" width="200" height="230" /><circle cx="200" cy="425" r="27" /><circle cx="100" cy="310" r="27" /></g></g>
  </g>
  <g class="pz-label"><rect x="5" y="338" width="200" height="28" rx="14"/><text x="105" y="356.5" text-anchor="middle">Pelvic inflammatory disease</text></g>
</g>
<g class="pz pz-p5" style="--dx:0px;--dy:230px;--rot:-6deg" filter="url(#pz-shadow)">
  <g mask="url(#m-p5)">
    <g clip-path="url(#pz-shape)"><rect x="0" y="0" width="600" height="585" class="pz-fill" style="fill:#BE5047"/><rect x="0" y="0" width="600" height="585" fill="url(#pz-sheen)"/><g class="pz-seam"><rect x="200" y="310" width="200" height="230" /><circle cx="200" cy="425" r="27" /><circle cx="400" cy="425" r="27" /><circle cx="300" cy="310" r="27" /></g></g>
  </g>
  <g class="pz-label"><rect x="217" y="382" width="167" height="28" rx="14"/><text x="300" y="400.5" text-anchor="middle">Stress / psychosomatic</text></g>
</g>
<g class="pz pz-p6" style="--dx:260px;--dy:160px;--rot:14deg" filter="url(#pz-shadow)">
  <g mask="url(#m-p6)">
    <g clip-path="url(#pz-shape)"><rect x="0" y="0" width="600" height="585" class="pz-fill" style="fill:#D4756A"/><rect x="0" y="0" width="600" height="585" fill="url(#pz-sheen)"/><g class="pz-seam"><rect x="400" y="310" width="200" height="230" /><circle cx="400" cy="425" r="27" /><circle cx="500" cy="310" r="27" /></g></g>
  </g>
  <g class="pz-label"><rect x="445" y="338" width="101" height="28" rx="14"/><text x="495" y="356.5" text-anchor="middle">Appendicitis</text></g>
</g>
<g class="pz-final"><rect x="186" y="540" width="228" height="34" rx="17"/><text x="300" y="563" text-anchor="middle">… the real one: Endometriosis</text></g>
</svg>