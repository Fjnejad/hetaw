<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 470" class="pz-svg" role="img" aria-labelledby="pzi-t pzi-d">
<title id="pzi-t">Consequences of unrecognised endometriosis</title>
<desc id="pzi-d">A medical illustration of the uterus cut into six jigsaw pieces, each labelled with a consequence of late diagnosis: chronic pain and fatigue, depression and anxiety, autoimmune conditions, bowel problems, infertility, silent kidney damage.</desc>
<defs>
<filter id="pzi-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0B1A33" flood-opacity=".28"/></filter>
<mask id="mi-p1" maskUnits="userSpaceOnUse" x="0" y="0" width="600" height="400"><rect x="0" y="0" width="600" height="400" fill="black"/><rect x="0" y="0" width="200" height="200" fill="white"/><circle cx="200" cy="100" r="30" fill="white"/><circle cx="100" cy="200" r="31.5" fill="black"/></mask>
<mask id="mi-p2" maskUnits="userSpaceOnUse" x="0" y="0" width="600" height="400"><rect x="0" y="0" width="600" height="400" fill="black"/><rect x="200" y="0" width="200" height="200" fill="white"/><circle cx="200" cy="100" r="31.5" fill="black"/><circle cx="400" cy="100" r="31.5" fill="black"/><circle cx="300" cy="200" r="30" fill="white"/></mask>
<mask id="mi-p3" maskUnits="userSpaceOnUse" x="0" y="0" width="600" height="400"><rect x="0" y="0" width="600" height="400" fill="black"/><rect x="400" y="0" width="200" height="200" fill="white"/><circle cx="400" cy="100" r="30" fill="white"/><circle cx="500" cy="200" r="31.5" fill="black"/></mask>
<mask id="mi-p4" maskUnits="userSpaceOnUse" x="0" y="0" width="600" height="400"><rect x="0" y="0" width="600" height="400" fill="black"/><rect x="0" y="200" width="200" height="200" fill="white"/><circle cx="200" cy="300" r="31.5" fill="black"/><circle cx="100" cy="200" r="30" fill="white"/></mask>
<mask id="mi-p5" maskUnits="userSpaceOnUse" x="0" y="0" width="600" height="400"><rect x="0" y="0" width="600" height="400" fill="black"/><rect x="200" y="200" width="200" height="200" fill="white"/><circle cx="200" cy="300" r="30" fill="white"/><circle cx="400" cy="300" r="30" fill="white"/><circle cx="300" cy="200" r="31.5" fill="black"/></mask>
<mask id="mi-p6" maskUnits="userSpaceOnUse" x="0" y="0" width="600" height="400"><rect x="0" y="0" width="600" height="400" fill="black"/><rect x="400" y="200" width="200" height="200" fill="white"/><circle cx="400" cy="300" r="31.5" fill="black"/><circle cx="500" cy="200" r="30" fill="white"/></mask>
</defs>
<rect class="pzi-ghost" x="0" y="0" width="600" height="400" rx="10"/>
<g class="pz pz-p1" style="--dx:-250px;--dy:-150px;--rot:-16deg" filter="url(#pzi-shadow)">
  <g mask="url(#mi-p1)"><image href="assets/uterus-pieces.jpg" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><rect x="0" y="0" width="600" height="400" class="pzi-tint"/><g class="pz-seam"><rect x="0" y="0" width="200" height="200"/><circle cx="200" cy="100" r="30"/><circle cx="100" cy="200" r="30"/></g></g>
  <g class="pzi-label"><rect x="8" y="85" width="184" height="30" rx="8"/><text x="100" y="105" text-anchor="middle">Chronic pain & fatigue</text></g>
</g>
<g class="pz pz-p2" style="--dx:0px;--dy:-230px;--rot:7deg" filter="url(#pzi-shadow)">
  <g mask="url(#mi-p2)"><image href="assets/uterus-pieces.jpg" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><rect x="0" y="0" width="600" height="400" class="pzi-tint"/><g class="pz-seam"><rect x="200" y="0" width="200" height="200"/><circle cx="200" cy="100" r="30"/><circle cx="400" cy="100" r="30"/><circle cx="300" cy="200" r="30"/></g></g>
  <g class="pzi-label"><rect x="215" y="85" width="170" height="30" rx="8"/><text x="300" y="105" text-anchor="middle">Depression & anxiety</text></g>
</g>
<g class="pz pz-p3" style="--dx:250px;--dy:-140px;--rot:15deg" filter="url(#pzi-shadow)">
  <g mask="url(#mi-p3)"><image href="assets/uterus-pieces.jpg" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><rect x="0" y="0" width="600" height="400" class="pzi-tint"/><g class="pz-seam"><rect x="400" y="0" width="200" height="200"/><circle cx="400" cy="100" r="30"/><circle cx="500" cy="200" r="30"/></g></g>
  <g class="pzi-label"><rect x="412" y="77" width="177" height="46" rx="8"/><text x="500" y="97" text-anchor="middle">Autoimmune conditions</text><text class="sub" x="500" y="114" text-anchor="middle">e.g. Hashimoto’s thyroiditis</text></g>
</g>
<g class="pz pz-p4" style="--dx:-260px;--dy:150px;--rot:-11deg" filter="url(#pzi-shadow)">
  <g mask="url(#mi-p4)"><image href="assets/uterus-pieces.jpg" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><rect x="0" y="0" width="600" height="400" class="pzi-tint"/><g class="pz-seam"><rect x="0" y="200" width="200" height="200"/><circle cx="200" cy="300" r="30"/><circle cx="100" cy="200" r="30"/></g></g>
  <g class="pzi-label"><rect x="37" y="277" width="126" height="46" rx="8"/><text x="100" y="297" text-anchor="middle">Bowel problems</text><text class="sub" x="100" y="314" text-anchor="middle">often labelled IBS</text></g>
</g>
<g class="pz pz-p5" style="--dx:0px;--dy:240px;--rot:-6deg" filter="url(#pzi-shadow)">
  <g mask="url(#mi-p5)"><image href="assets/uterus-pieces.jpg" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><rect x="0" y="0" width="600" height="400" class="pzi-tint"/><g class="pz-seam"><rect x="200" y="200" width="200" height="200"/><circle cx="200" cy="300" r="30"/><circle cx="400" cy="300" r="30"/><circle cx="300" cy="200" r="30"/></g></g>
  <g class="pzi-label"><rect x="240" y="285" width="120" height="30" rx="8"/><text x="300" y="305" text-anchor="middle">Infertility</text></g>
</g>
<g class="pz pz-p6" style="--dx:260px;--dy:150px;--rot:13deg" filter="url(#pzi-shadow)">
  <g mask="url(#mi-p6)"><image href="assets/uterus-pieces.jpg" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><rect x="0" y="0" width="600" height="400" class="pzi-tint"/><g class="pz-seam"><rect x="400" y="200" width="200" height="200"/><circle cx="400" cy="300" r="30"/><circle cx="500" cy="200" r="30"/></g></g>
  <g class="pzi-label"><rect x="415" y="277" width="170" height="46" rx="8"/><text x="500" y="297" text-anchor="middle">Silent kidney damage</text><text class="sub" x="500" y="314" text-anchor="middle">from ureteral endometriosis</text></g>
</g>
<g class="pz-final"><rect x="120" y="422" width="360" height="34" rx="17"/><text x="300" y="445" text-anchor="middle">Left unrecognised, it does not stay in the pelvis.</text></g>
</svg>