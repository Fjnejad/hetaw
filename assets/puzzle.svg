<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 651 544" class="jg-svg" role="img" aria-labelledby="jg-t jg-d">
<title id="jg-t">Consequences of unrecognised endometriosis</title>
<desc id="jg-d">A jigsaw of a uterus illustration. Coloured pieces carry common consequences; white pieces carry rarer ones.</desc>
<image href="assets/uterus-jigsaw.png" x="0" y="0" width="651" height="544"/>
<g class="jg-chip common" style="--i:0"><rect x="22" y="55" width="118" height="26" rx="13"/><text x="81" y="72" text-anchor="middle">Painful periods</text></g>
<g class="jg-chip common" style="--i:1"><rect x="173" y="55" width="143" height="26" rx="13"/><text x="244" y="72" text-anchor="middle">Chronic pelvic pain</text></g>
<g class="jg-chip common" style="--i:2"><rect x="348" y="55" width="118" height="26" rx="13"/><text x="407" y="72" text-anchor="middle">Pain during sex</text></g>
<g class="jg-chip common" style="--i:3"><rect x="537" y="55" width="66" height="26" rx="13"/><text x="570" y="72" text-anchor="middle">Fatigue</text></g>
<g class="jg-chip common" style="--i:4"><rect x="16" y="191" width="130" height="26" rx="13"/><text x="81" y="208" text-anchor="middle">Ovarian reserve ↓</text></g>
<g class="jg-chip common" style="--i:5"><rect x="198" y="191" width="92" height="26" rx="13"/><text x="244" y="208" text-anchor="middle">Infertility</text></g>
<g class="jg-chip common" style="--i:6"><rect x="351" y="191" width="111" height="26" rx="13"/><text x="407" y="208" text-anchor="middle">Bowel problems</text></g>
<g class="jg-chip common" style="--i:7"><rect x="508" y="191" width="124" height="26" rx="13"/><text x="570" y="208" text-anchor="middle">Bladder symptoms</text></g>
<g class="jg-chip common" style="--i:8"><rect x="185" y="327" width="118" height="26" rx="13"/><text x="244" y="344" text-anchor="middle">Pregnancy risks</text></g>
<g class="jg-chip common" style="--i:9"><rect x="332" y="327" width="150" height="26" rx="13"/><text x="407" y="344" text-anchor="middle">Depression & anxiety</text></g>
<g class="jg-chip common" style="--i:10"><rect x="205" y="463" width="79" height="26" rx="13"/><text x="244" y="480" text-anchor="middle">Adhesions</text></g>
<g class="jg-chip common" style="--i:11"><rect x="345" y="463" width="124" height="26" rx="13"/><text x="407" y="480" text-anchor="middle">Autoimmune links</text></g>
<g class="jg-chip rare" style="--i:12"><rect x="6" y="327" width="150" height="26" rx="13"/><text x="81" y="344" text-anchor="middle">Silent kidney damage</text></g>
<g class="jg-chip rare" style="--i:13"><rect x="508" y="327" width="124" height="26" rx="13"/><text x="570" y="344" text-anchor="middle">Lung / diaphragm</text></g>
<g class="jg-chip rare" style="--i:14"><rect x="10" y="463" width="143" height="26" rx="13"/><text x="81" y="480" text-anchor="middle">Cardiovascular risk</text></g>
<g class="jg-chip rare" style="--i:15"><rect x="485" y="463" width="169" height="26" rx="13"/><text x="570" y="480" text-anchor="middle">Ovarian cancer, small ↑</text></g>
</svg>