<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 20 740 640" width="740" height="640" role="img" aria-labelledby="bm-title bm-desc">
  <title id="bm-title">Where endometriosis shows up in the body</title>
  <desc id="bm-desc">A front-facing figure with markers at the diaphragm and chest, the bowel, the bladder, the pelvis, the lower back and the legs, plus fatigue, showing that symptoms are scattered across several specialties.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#C9972B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#C9972B" stop-opacity="0"/>
    </radialGradient>
    <style>
      .body{fill:#EEEBE3;stroke:#0B1A33;stroke-width:1.4;stroke-linejoin:round}
      .line{stroke:#0B1A33;stroke-width:1;stroke-dasharray:3 3;fill:none}
      .dot{fill:#0B1A33}
      .dot.key{fill:#C9972B}
      .lbl{font-family:'Source Sans 3',system-ui,sans-serif;font-size:14px;font-weight:600;fill:#0B1A33}
      .sub{font-family:'Source Sans 3',system-ui,sans-serif;font-size:12px;fill:#5B6479}
    </style>
  </defs>

  <!-- figure -->
  <g class="body">
    <ellipse cx="280" cy="78" rx="34" ry="40"/>
    <path d="M262 116 Q280 126 298 116 L300 136 Q280 142 260 136 Z"/>
    <path d="M200 160 Q280 128 360 160 L388 300 Q384 318 368 318 L350 236 L346 330 Q346 360 334 390 L336 470 L332 640 Q332 660 318 660 L296 660 Q284 660 284 640 L280 480 L276 640 Q276 660 264 660 L242 660 Q228 660 228 640 L224 470 L226 390 Q214 360 214 330 L210 236 L192 318 Q176 318 172 300 Z"/>
  </g>

  <!-- pelvic glow -->
  <circle cx="280" cy="372" r="54" fill="url(#glow)"/>

  <!-- markers: x,y on body; label positions left/right -->
  <!-- fatigue / head -->
  <circle class="dot" cx="280" cy="78" r="5"/>
  <path class="line" d="M285 78 L400 78"/>
  <text class="lbl" x="408" y="74">Fatigue, brain fog</text>
  <text class="sub" x="408" y="90">seen by: GP</text>

  <!-- diaphragm / chest -->
  <circle class="dot" cx="318" cy="222" r="5"/>
  <path class="line" d="M323 222 L400 182"/>
  <text class="lbl" x="408" y="178">Chest and shoulder pain</text>
  <text class="sub" x="408" y="194">cyclical · diaphragm · often unrecognised</text>

  <!-- bowel -->
  <circle class="dot" cx="236" cy="312" r="5"/>
  <path class="line" d="M231 312 L160 272"/>
  <text class="lbl" x="152" y="268" text-anchor="end">Bowel complaints</text>
  <text class="sub" x="152" y="284" text-anchor="end">seen by: gastroenterologist</text>

  <!-- bladder -->
  <circle class="dot" cx="280" cy="346" r="5"/>
  <path class="line" d="M285 346 L400 322"/>
  <text class="lbl" x="408" y="318">Bladder symptoms</text>
  <text class="sub" x="408" y="334">seen by: urologist</text>

  <!-- pelvis (key) -->
  <circle class="dot key" cx="280" cy="384" r="7"/>
  <path class="line" d="M273 384 L160 404"/>
  <text class="lbl" x="152" y="400" text-anchor="end">Pelvic pain, painful periods</text>
  <text class="sub" x="152" y="416" text-anchor="end">seen by: gynaecologist</text>

  <!-- lower back -->
  <circle class="dot" cx="322" cy="396" r="5"/>
  <path class="line" d="M327 396 L400 430"/>
  <text class="lbl" x="408" y="426">Lower back and sciatic pain</text>
  <text class="sub" x="408" y="442">seen by: orthopaedics, pain clinic</text>

  <!-- fertility -->
  <circle class="dot" cx="256" cy="420" r="5"/>
  <path class="line" d="M251 420 L160 488"/>
  <text class="lbl" x="152" y="484" text-anchor="end">Difficulty conceiving</text>
  <text class="sub" x="152" y="500" text-anchor="end">seen by: fertility clinic</text>

  <!-- legs -->
  <circle class="dot" cx="304" cy="560" r="5"/>
  <path class="line" d="M309 560 L400 560"/>
  <text class="lbl" x="408" y="556">Pain radiating into the legs</text>
  <text class="sub" x="408" y="572">cyclical · nerve involvement</text>

</svg>
